name: Lint

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**.sh'
      - '.github/scripts/**'
      - '.github/workflows/**.yml'
      - 'catalog/driver-catalog.json'
      - '.github/tracked-versions.json'
      - 'third_party/**'
  pull_request:
    paths:
      - 'scripts/**.sh'
      - '.github/scripts/**'
      - '.github/workflows/**.yml'
      - 'catalog/driver-catalog.json'
      - '.github/tracked-versions.json'
      - 'third_party/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: |
          shellcheck --severity=warning \
            scripts/build-nvidia-sysext.sh \
            scripts/build-on-host.sh \
            scripts/install-nvidia-driver.sh \
            scripts/uninstall-nvidia-driver.sh \
            scripts/recover-stock-nvidia.sh \
            scripts/nvidia-preinit-driver.sh \
            .github/scripts/*.sh

  catalog:
    name: driver-catalog.json shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/validate-catalog.sh

  patch-pin:
    name: 470 patch-set pin matches the submodule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare PATCH_470XX_COMMIT with the third_party submodule commit
        run: |
          # On-host builds download the 470xx patch set at PATCH_470XX_COMMIT
          # (build-nvidia-sysext.sh); the submodule is the reviewed pin. A bump
          # must move both.
          sub=$(git ls-tree HEAD third_party/nvidia-470xx-linux-mainline | awk '{print $3}')
          pin=$(sed -nE 's/^PATCH_470XX_COMMIT="([0-9a-f]{40})"$/\1/p' scripts/build-nvidia-sysext.sh)
          echo "submodule: ${sub:-<none>}"
          echo "script:    ${pin:-<none>}"
          if [ -z "$sub" ] || [ -z "$pin" ] || [ "$sub" != "$pin" ]; then
            echo "::error::PATCH_470XX_COMMIT in scripts/build-nvidia-sysext.sh must equal the third_party/nvidia-470xx-linux-mainline submodule commit"
            exit 1
          fi

  tracked-versions:
    name: tracked-versions.json shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate tracked-versions.json
        run: |
          python3 - <<'PY'
          import json, re, sys
          with open(".github/tracked-versions.json") as f:
              d = json.load(f)
          tn = d.get("truenas", {})
          if not re.match(r'^\d+\.\d+', str(tn.get("version", ""))):
              print("truenas.version missing or malformed", file=sys.stderr); sys.exit(1)
          if not tn.get("train"):
              print("truenas.train missing", file=sys.stderr); sys.exit(1)
          print("tracked-versions.json OK")
          PY

  actionlint:
    name: actionlint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Run actionlint
        run: ./actionlint -color -shellcheck "shellcheck --severity=warning"
