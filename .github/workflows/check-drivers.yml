name: Refresh driver catalog

# Daily scrape of NVIDIA's Linux driver index. Updates open_latest (newest N
# open-capable drivers) and the legacy-branch version pins in
# catalog/driver-catalog.json, then commits if anything changed. The picker in
# install-nvidia-driver.sh reads this file, so this keeps `--list`,
# `--branch=latest`, and the card-detected recommendation current without
# manual upkeep.

on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Mint a token from sysext-ci-automation-app (in the default-branch
      # ruleset bypass list) so the catalog-refresh commit can push to main;
      # the default GITHUB_TOKEN's github-actions[bot] is not a bypass actor.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Refresh catalog from NVIDIA index
        run: python3 .github/scripts/refresh-catalog.py --summary-file "$RUNNER_TEMP/catalog-changes.md"

      - name: Validate refreshed catalog
        run: .github/scripts/validate-catalog.sh

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- catalog/driver-catalog.json; then
            echo "No catalog change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The refresh script wrote a human-readable change set; carry it into
          # the commit body, this run's summary, and (below) the release dispatch.
          summary="$(cat "$RUNNER_TEMP/catalog-changes.md" 2>/dev/null || true)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog/driver-catalog.json
          git commit -m "catalog: refresh NVIDIA driver versions [skip ci]" -m "$summary"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<CATALOG_EOF"
            echo "$summary"
            echo "CATALOG_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Catalog refresh"
            echo "$summary"
          } >> "$GITHUB_STEP_SUMMARY"

      # New drivers landed in the catalog → cut a gated release: release.yml
      # runs the full build matrix (CI), and on green publishes a PRERELEASE +
      # opens a hardware-test issue. Closing that issue promotes it to Latest
      # (promote.yml). Same auto-update shape as the other repos' check-*.
      # (The catalog commit carries [skip ci], so this explicit dispatch is the
      # only thing that runs — via the app token, which has actions:write.)
      - name: Cut a gated prerelease for the new drivers
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v9
        env:
          CHANGE_SUMMARY: ${{ steps.commit.outputs.summary }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: 'main',
              inputs: {
                mark_latest: 'false',
                change_summary: process.env.CHANGE_SUMMARY || ''
              }
            });
            console.log('Dispatched release.yml (mark_latest=false) after catalog bump');
