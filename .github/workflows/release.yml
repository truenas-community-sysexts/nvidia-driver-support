name: Release

# Cuts a versioned "NVIDIA driver installer" release.
#
# A release is a snapshot of the MIT install tooling + the driver catalog (the
# whole supported matrix) — NOT tied to a specific driver, kmod, or TrueNAS
# version, and never carries nvidia.raw (NVIDIA's EULA bars redistributing the
# proprietary userspace). The install script detects the card and builds the
# right driver ON THE USER'S HOST, so one release covers the whole matrix.
#
# Tag: `v<run_number>`. Manual dispatch.
#
# GATE (unified across the org):
#   1. CI passed — the FULL build-sysext smoke matrix (every driver variant)
#      must compile green on this commit (release.yml calls build-sysext.yml as
#      a required `smoke` job; publish needs it).
#   2. Human-tested — the build publishes a PRERELEASE and opens a
#      `hardware-test` issue. After verifying >=1 driver variant on real
#      hardware, the operator closes that issue, which (via promote.yml) flips
#      the prerelease to Latest and appends the changelog.
# Override: dispatch with mark_latest=true to publish straight to Latest
# (skips the issue gate) — for a first release or trivial tooling fix.

on:
  workflow_dispatch:
    inputs:
      mark_latest:
        description: 'true = publish straight to Latest; false (default) = prerelease + hardware-test gate'
        required: false
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'false'

permissions:
  contents: write
  issues: write

jobs:
  # Gate 1 (CI passed): run the entire driver build matrix on this commit.
  # No `with:` => build-sysext builds the full catalog matrix. If any variant
  # fails to compile, this job fails and `publish` never runs.
  smoke:
    uses: ./.github/workflows/build-sysext.yml

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Write release notes
        env:
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Build the notes from the catalog + CI smoke target so the "supported"
          # list can't drift from what's actually shipped. Each line is a plain
          # string literal, so source indentation never leaks into the output.
          python3 - <<'PY'
          import json, os
          cat = json.load(open("catalog/driver-catalog.json"))
          tracked = json.load(open(".github/tracked-versions.json"))
          run = os.environ["RUN_NUMBER"]
          sha = os.environ["COMMIT_SHA"]
          repo = os.environ["REPO"]
          br = cat.get("branches", {})
          def bv(name): return br.get(name, {}).get("version", "?")
          open_latest = ", ".join(f"`{v}`" for v in cat.get("open_latest", []))
          tn = tracked["truenas"]["version"]
          raw = f"https://raw.githubusercontent.com/{repo}/main/scripts/install-nvidia-driver.sh"
          parts = [
              "The **NVIDIA driver installer** for TrueNAS — the MIT install scripts + the driver catalog. It does **not** ship a prebuilt driver (NVIDIA's EULA bars redistributing the proprietary userspace): the installer detects your card and builds the right driver **on your host**, so this single release covers the whole supported matrix:",
              "",
              f"- **Open drivers** (Turing+): {open_latest}",
              f"- **Legacy branches**: `{bv('legacy-580')}` (Maxwell/Pascal/Volta), `{bv('legacy-470')}` (Kepler) — proprietary; `{bv('legacy-390')}` (Fermi), `{bv('legacy-340')}` (Tesla) — best-effort/patched",
              f"- **Validated in CI against**: TrueNAS `{tn}` (full build matrix compiled green for this release)",
              "",
              "Open vs proprietary modules are auto-derived per card. The TrueNAS version is **not** pinned — the build adapts to the host's running kernel (25.x / 26.x aware), so this release works across TrueNAS versions; a kernel bump just triggers an on-host rebuild.",
              "",
              "Install (detects your card, recommends a driver, builds on-host):",
              "",
              f"`curl -fsSL {raw} | sudo bash`",
              "",
              "Pin this exact tooling + catalog snapshot:",
              "",
              f"`curl -fsSL {raw} | sudo bash -s -- --release=v{run}`",
              "",
              f"- Release: `v{run}`",
              f"- Source commit: `{sha}`",
              "",
              "By installing you accept the [NVIDIA Linux Driver License](https://www.nvidia.com/en-us/drivers/nvidia-license/) — the build invokes the official `.run` with `--silent` on your host. **Reboot required** after install.",
          ]
          with open("release-notes.md", "w") as f:
              f.write("\n".join(parts) + "\n")
          PY
          echo "=== release-notes.md ==="; cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.run_number }}
          name: "NVIDIA driver installer v${{ github.run_number }}"
          body_path: release-notes.md
          # MIT tooling + catalog only — no nvidia.raw (EULA, see header).
          files: |
            scripts/install-nvidia-driver.sh
            scripts/uninstall-nvidia-driver.sh
            scripts/nvidia-preinit-driver.sh
            scripts/recover-stock-nvidia.sh
            scripts/build-on-host.sh
            scripts/build-nvidia-sysext.sh
            catalog/driver-catalog.json
          draft: false
          # Default: prerelease gated behind a hardware-test issue (promoted by
          # promote.yml on issue close). Override mark_latest=true to publish
          # straight to Latest.
          prerelease: ${{ inputs.mark_latest != 'true' }}
          make_latest: ${{ inputs.mark_latest == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open hardware-test issue (prerelease gate)
        if: inputs.mark_latest != 'true'
        uses: actions/github-script@v9
        env:
          RUN_NUMBER: ${{ github.run_number }}
        with:
          script: |
            const tag = `v${process.env.RUN_NUMBER}`;
            const { owner, repo } = context.repo;
            const releaseUrl = `https://github.com/${owner}/${repo}/releases/tag/${tag}`;
            const title = `Hardware test: NVIDIA driver installer ${tag}`;
            try {
              await github.rest.issues.createLabel({ owner, repo, name: 'hardware-test',
                color: 'FBCA04', description: 'Build awaiting verification on real hardware' });
            } catch (e) { if (e.status !== 422) throw e; }
            const existing = await github.rest.issues.listForRepo({ owner, repo,
              state: 'open', labels: 'hardware-test', per_page: 100 });
            if (existing.data.some(i => i.title.includes(tag))) {
              console.log(`Open hardware-test issue already exists for ${tag}, skipping`); return;
            }
            await github.rest.issues.create({ owner, repo, title, labels: ['hardware-test'],
              body: [
                `The full driver build matrix compiled green in CI for this commit. Before promoting to **Latest**, verify at least one driver variant **on real hardware** (CI can't drive a GPU).`,
                ``,
                `**Release:** [${tag}](${releaseUrl})`,
                `<!-- release-tag: ${tag} -->`,
                ``,
                `### Test checklist (at least one variant)`,
                `- [ ] \`curl -fsSL ${`https://raw.githubusercontent.com/${owner}/${repo}/main/scripts/install-nvidia-driver.sh`} | sudo bash\` on a box with an NVIDIA GPU`,
                `- [ ] The picker recommends a sensible driver for the detected card`,
                `- [ ] The driver builds on-host and \`nvidia-smi\` works after reboot`,
                `- [ ] Note which driver/branch + card you tested in a comment below`,
                ``,
                `### Promote`,
                `This build is published as a **pre-release**, so it is not served by \`releases/latest\` (or the install script's \`--release=latest\`) yet. Once verified, **close this issue as completed** — that automatically promotes [\`${tag}\`](${releaseUrl}) to the latest release and appends the changelog.`,
              ].join('\n') });
            console.log(`Created hardware-test issue for ${tag}`);
