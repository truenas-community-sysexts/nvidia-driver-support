name: Release

# Cuts a versioned "NVIDIA driver installer" release.
#
# A release is a snapshot of the MIT install tooling + the driver catalog (the
# whole supported matrix) — NOT tied to a specific driver, kmod, or TrueNAS
# version, and never carries nvidia.raw (NVIDIA's EULA bars redistributing the
# proprietary userspace). The install script detects the card and builds the
# right driver ON THE USER'S HOST, so one release covers the whole matrix.
#
# Tag: `v<run_number>`. Manual dispatch.
#
# GATE (unified across the org):
#   1. CI passed — the FULL build-sysext smoke matrix (every driver variant)
#      must compile green on this commit (release.yml calls build-sysext.yml as
#      a required `smoke` job; publish needs it).
#   2. Human-tested, per TrueNAS train: the build publishes a PRERELEASE and
#      opens one hardware-test issue per train in tracked-versions.json
#      (`hardware-test` for a stable train, `preview-hardware-test` for a
#      preview one). Closing a train's issue as completed approves the release
#      for that train's boxes only (promote.yml adds a verified-train marker
#      to its notes); get.sh installs only releases approved for the box's
#      train.
# There is no publish-straight-to-Latest option: a full release with no
# verified-train marker counts as approved for every train (that is how
# releases from before per-train sign-off stay installable), so it would
# reach every box untested.

on:
  workflow_dispatch:
    inputs:
      change_summary:
        description: 'Markdown summary of catalog changes (auto-filled by check-drivers; leave empty for manual tooling releases)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  issues: write

jobs:
  # Gate 1 (CI passed): run the entire driver build matrix on this commit.
  # No `with:` => build-sysext builds the full catalog matrix. If any variant
  # fails to compile, this job fails and `publish` never runs.
  smoke:
    uses: ./.github/workflows/build-sysext.yml

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Write release notes
        env:
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          CHANGE_SUMMARY: ${{ inputs.change_summary }}
        run: |
          set -euo pipefail
          # Build the notes from the catalog + CI smoke target so the "supported"
          # list can't drift from what's actually shipped. Each line is a plain
          # string literal, so source indentation never leaks into the output.
          python3 - <<'PY'
          import json, os
          cat = json.load(open("catalog/driver-catalog.json"))
          tracked = json.load(open(".github/tracked-versions.json"))
          run = os.environ["RUN_NUMBER"]
          sha = os.environ["COMMIT_SHA"]
          repo = os.environ["REPO"]
          br = cat.get("branches", {})
          def bv(name): return br.get(name, {}).get("version", "?")
          open_latest = ", ".join(f"`{v}`" for v in cat.get("open_latest", []))
          tn = tracked["truenas"]["version"]
          trains = ", ".join(t["name"] for t in tracked["trains"])
          get = f"https://raw.githubusercontent.com/{repo}/main/get.sh"
          change = os.environ.get("CHANGE_SUMMARY", "").strip()
          parts = []
          if change:
              parts += ["### What changed", change, ""]
          parts += [
              "The **NVIDIA driver installer** for TrueNAS — the MIT install scripts + the driver catalog. It does **not** ship a prebuilt driver (NVIDIA's EULA bars redistributing the proprietary userspace): the installer detects your card and builds the right driver **on your host**, so this single release covers the whole supported matrix:",
              "",
              f"- **Open drivers** (Turing+): {open_latest}",
              f"- **Legacy branches**: `{bv('legacy-580')}` (Maxwell/Pascal/Volta), `{bv('legacy-470')}` (Kepler) — proprietary; `{bv('legacy-390')}` (Fermi), `{bv('legacy-340')}` (Tesla) — best-effort/patched",
              f"- **Validated in CI against**: TrueNAS `{tn}` (full build matrix compiled green for this release)",
              "",
              "Open vs proprietary modules are auto-derived per card. The TrueNAS version is **not** pinned — the build adapts to the host's running kernel (25.x / 26.x aware), so this release works across TrueNAS versions; a kernel bump just triggers an on-host rebuild.",
              "",
              f"This release starts as a pre-release. A hardware test on a TrueNAS train ({trains}) approves it for that train's boxes only; until then the one-liner keeps installing the newest release approved for each train.",
              "",
              "Install (the newest release approved for your TrueNAS train; detects your card, recommends a driver, builds on-host):",
              "",
              f"`curl -fsSL {get} | sudo bash`",
              "",
              "Pin this exact tooling + catalog snapshot:",
              "",
              f"`curl -fsSL {get} | sudo bash -s -- --release=v{run}`",
              "",
              f"- Release: `v{run}`",
              f"- Source commit: `{sha}`",
              "",
              "By installing you accept the [NVIDIA Linux Driver License](https://www.nvidia.com/en-us/drivers/nvidia-license/) — the build invokes the official `.run` with `--silent` on your host. **Reboot required** after install.",
          ]
          with open("release-notes.md", "w") as f:
              f.write("\n".join(parts) + "\n")
          PY
          echo "=== release-notes.md ==="; cat release-notes.md

      - name: Create draft release with assets
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.run_number }}
          name: "NVIDIA driver installer v${{ github.run_number }}"
          body_path: release-notes.md
          # MIT tooling + catalog only — no nvidia.raw (EULA, see header).
          files: |
            scripts/install-nvidia-driver.sh
            scripts/uninstall-nvidia-driver.sh
            scripts/nvidia-preinit-driver.sh
            scripts/recover-stock-nvidia.sh
            scripts/build-on-host.sh
            scripts/build-nvidia-sysext.sh
            catalog/driver-catalog.json
          # Draft first so assets attach even on immutable-release repos.
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the draft as a prerelease, always: it is approved per train
      # only by that train's hardware-test issue (promote.yml).
      - name: Publish the draft as a prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REL_ID: ${{ steps.release.outputs.id }}
        run: gh api --method PATCH "repos/${REPO}/releases/${REL_ID}" -F draft=false -F prerelease=true

      - name: Open hardware-test issues, one per train (prerelease gate)
        uses: actions/github-script@v9
        env:
          RUN_NUMBER: ${{ github.run_number }}
          CHANGE_SUMMARY: ${{ inputs.change_summary }}
        with:
          script: |
            const tag = `v${process.env.RUN_NUMBER}`;
            const change = (process.env.CHANGE_SUMMARY || '').trim();
            const { owner, repo } = context.repo;
            const releaseUrl = `https://github.com/${owner}/${repo}/releases/tag/${tag}`;
            const fs = require('fs');
            // One issue per supported TrueNAS train: a hardware test approves this
            // release for its own train's boxes only (promote.yml). Stable trains use
            // the hardware-test label, preview (beta) trains preview-hardware-test.
            const { trains } = JSON.parse(fs.readFileSync('.github/tracked-versions.json', 'utf8'));
            const labelOf = (t) => (t.channel === 'preview' ? 'preview-hardware-test' : 'hardware-test');
            const labels = {
              'hardware-test': { color: 'FBCA04',
                description: 'Build awaiting verification on real hardware' },
              'preview-hardware-test': { color: '5319E7',
                description: 'Build awaiting verification on real hardware, on a TrueNAS preview (beta) train' },
            };
            for (const name of new Set(trains.map(labelOf))) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, ...labels[name] });
              } catch (e) { if (e.status !== 422) throw e; }
            }
            // Title: what to test | on what | which build. The train names the "on
            // what"; the tag goes last, verbatim. The drivers come from this commit's
            // catalog (checked out above): the newest open driver, then each branch
            // pinned to a version (the legacy ones), newest first.
            const catalog = JSON.parse(fs.readFileSync('catalog/driver-catalog.json', 'utf8'));
            const legacy = Object.values(catalog.branches || {})
              .map((b) => b.version).filter(Boolean)
              .sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
            const also = legacy.length ? ` (also ${legacy.join(', ')})` : '';
            // Duplicate check, keyed on tag AND train: an open issue whose markers
            // (or title) name both already covers the pair. An open issue for this tag
            // with no train marker and no train in its title is the single issue from
            // before per-train sign-off: it covered every train (promote.yml still
            // approves it for all of them), so it suppresses them all.
            const open = [];
            for (const name of Object.keys(labels)) {
              open.push(...(await github.rest.issues.listForRepo({ owner, repo,
                state: 'open', labels: name, per_page: 100 })).data);
            }
            const issueTag = (i) => ((i.body || '').match(/<!--\s*release-tag:\s*(\S+?)\s*-->/) || [])[1] || '';
            const issueTrain = (i) => ((i.body || '').match(/<!--\s*train:\s*(\S+?)\s*-->/) || [])[1] || '';
            const covers = (i, t) => {
              if (issueTag(i) !== tag && !i.title.endsWith(` ${tag}`)) return false;
              if (issueTrain(i)) return issueTrain(i) === t.key;
              const named = trains.find((x) => i.title.includes(`, ${x.name} |`));
              return named ? named.key === t.key : true;
            };
            // Test instructions. Every command must work exactly as written on a
            // TrueNAS box: a human validator pastes them. The one-liner runs main's
            // get.sh (what users run); --release makes it run this release's installer
            // and pins the helpers + catalog to this release's assets.
            const inst = `https://raw.githubusercontent.com/${owner}/${repo}/main/get.sh`;
            const base = `https://github.com/${owner}/${repo}/releases/download/${tag}`;
            for (const t of trains) {
              const preview = t.channel === 'preview';
              const title = `${preview ? 'Preview hardware test' : 'Hardware test'}: NVIDIA driver ${catalog.open_latest[0]}${also} | any NVIDIA GPU, ${t.name} | installer ${tag}`;
              const dup = open.find((i) => covers(i, t));
              if (dup) {
                console.log(`Open issue #${dup.number} already covers ${tag} on ${t.name}, skipping`);
                continue;
              }
              const others = trains.filter((x) => x.key !== t.key).map((x) => x.name);
              await github.rest.issues.create({ owner, repo, title, labels: [labelOf(t)],
                body: [
                  `The full driver build matrix compiled green in CI for this commit. This issue approves it for **${t.name}** boxes only: verify at least one driver variant **on real hardware, on a ${t.name} box** (CI can't drive a GPU).${others.length ? ` ${others.join(', ')} ${others.length > 1 ? 'have their own issues' : 'has its own issue'} for this release.` : ''}`,
                  ``,
                  `**Release:** [${tag}](${releaseUrl})`,
                  `**Train:** ${t.name} (\`cat /etc/version\` starts with \`${t.key}.\`)`,
                  `<!-- release-tag: ${tag} -->`,
                  `<!-- train: ${t.key} -->`,
                  ...(change ? [``, `### What changed`, change] : []),
                  ``,
                  `### Requirements`,
                  `- A ${t.name} box with an NVIDIA GPU. The driver is built on this host against its running kernel, so there is no kernel pin.`,
                  `- Internet access and about 8 minutes: the driver is built in a docker container on this box (if Apps is disabled the build starts docker itself).`,
                  `- A current stock-driver backup on the data pool; the installer (and its dry run) refuses a missing one, or a stale one made for another kernel. Step 1 creates it if missing, or refreshes it if it is out of date.`,
                  `- The install stops GPU apps for the swap and tries to restart them; GPU apps and \`nvidia-smi\` only work again after the reboot in step 4.`,
                  ``,
                  `### 1. Pre-checks`,
                  "```bash",
                  `cat /etc/version                       # starts with ${t.key}. (this issue's train)`,
                  `lspci -nn -d 10de:                     # lists the NVIDIA GPU`,
                  `nvidia-smi --query-gpu=name,driver_version --format=csv,noheader   # card + current driver (errors if the running driver lacks support for the card)`,
                  `ls -l /mnt/*/.config/nvidia-gpu/nvidia-original.raw               # stock backup must exist`,
                  "```",
                  `If that \`ls\` fails, create the backup (downloads about 2 GB):`,
                  "```bash",
                  `curl -fsSL ${base}/recover-stock-nvidia.sh | sudo bash`,
                  "```",
                  `A backup that exists can still be stale: it holds the stock driver of the TrueNAS version it was made on. One made before the last TrueNAS update (for example 25.10 to 26) is built for the old kernel, and restoring it would put that driver on the new one. Compare the date \`ls -l\` printed with the creation date of the running boot environment (normally when this TrueNAS version was installed), and check which kernel the backup's modules are for:`,
                  "```bash",
                  `zfs list -H -o name,creation /   # running boot environment and when it was created`,
                  `unsquashfs -l /mnt/*/.config/nvidia-gpu/nvidia-original.raw 'usr/lib/modules/*' | grep -c "/$(uname -r)/"   # 0 means the backup is for another kernel`,
                  "```",
                  `If the backup is older than that boot environment, or the count is 0, refresh it with the same \`recover-stock-nvidia.sh\` command as above. Run without flags, it fetches the stock driver of the running version (read from \`/etc/version\`) and overwrites the existing \`nvidia-original.raw\`; it does not skip or prompt when a backup exists.`,
                  ``,
                  `### 2. Install this build`,
                  `No hardware test has approved it for ${t.name} yet, so plain \`get.sh\` would install the newest approved release instead. Pin this build with \`--release\`:`,
                  "```bash",
                  `I=${inst}`,
                  `curl -fsSL "$I" | sudo bash -s -- --release=${tag} --dry-run   # "Release: ${tag} (sourcing install tooling + catalog from its assets)", ends "Dry-run complete"`,
                  `curl -fsSL "$I" | sudo bash -s -- --release=${tag}             # pick the recommended driver; prints "REBOOT REQUIRED" when done`,
                  "```",
                  `Add \`--pool=NAME\` if it asks for a pool. To test a specific variant add \`--branch=latest\`, \`--branch=legacy-580\`, \`--branch=legacy-470\` or \`--driver=X.Y.Z\`.`,
                  ``,
                  `### 3. Verify`,
                  "```bash",
                  `curl -fsSL "$I" | sudo bash -s -- --release=${tag} --check   # 0 fail; an nvidia-smi warning is expected until the reboot`,
                  "```",
                  `If a driver was working before this install, expect more until the reboot in step 4, because the new driver's userspace meets the old driver's loaded kernel module: \`nvidia-smi\` prints \`Failed to initialize NVML: Driver/library version mismatch\`, and the whole Apps service can fail to start (the Apps page shows "Failed to start docker for Applications", and \`systemctl status docker\` shows \`start-limit-hit\`). The installer also stops running GPU apps for the swap, and may print \`WARN: could not restart <app>\` when it tries to start them again. All of this is expected until the reboot; step 4 covers any app left stopped.`,
                  ``,
                  `### 4. Reboot and re-verify`,
                  "```bash",
                  `sudo reboot`,
                  "```",
                  `After it is back up:`,
                  "```bash",
                  `I=${inst}`,
                  `curl -fsSL "$I" | sudo bash -s -- --release=${tag} --check   # 0 fail, "Driver versions match: sysext=X, runtime=X"`,
                  `nvidia-smi                                  # GPU listed, driver version = the one you picked`,
                  `sudo journalctl -b -t nvidia-preinit-driver --no-pager -o cat | grep -E '^(ERROR|WARN|Done)'   # just "Done"`,
                  `sudo docker ps --format '{{.Names}}\\t{{.Status}}'                  # GPU apps Up, not Restarting`,
                  `sudo nvidia-smi mig -lgi                    # MIG boxes only: GPU instances recreated`,
                  "```",
                  `GPU apps the installer stopped but could not restart (the \`WARN: could not restart <app>\` lines in step 2, also listed in its final "REBOOT REQUIRED" message) stay stopped after the reboot, so they are missing from the \`docker ps\` list. Start each one from the Apps UI or with \`sudo midclt call -j app.start <app>\`, then check:`,
                  "```bash",
                  `sudo midclt call app.query '[]' '{"select":["name","state"]}'   # each app you started shows "state": "RUNNING"`,
                  "```",
                  ``,
                  `### 5. Report and sign off`,
                  `Comment with \`cat /etc/version\`, the card, the driver/branch you picked, and the step 4 output of \`--check\` and \`nvidia-smi\`. Sign off here only for a test on ${t.name}.`,
                  `- Works: close this issue as **completed**. That approves [\`${tag}\`](${releaseUrl}) for ${t.name} boxes: promote.yml adds a \`verified-train: ${t.key}\` marker to its notes, and \`get.sh\` then installs it there. The first train to approve a release also makes it a full release and appends the changelog.`,
                  `- Broken: comment what failed, then close as **not planned**. Nothing changes: ${t.name} boxes keep the newest release approved for them. To go back to the stock driver: \`sudo uninstall-nvidia-driver && sudo reboot\`.`,
                ].join('\n') });
              console.log(`Created ${labelOf(t)} issue for ${tag} on ${t.name}`);
            }
