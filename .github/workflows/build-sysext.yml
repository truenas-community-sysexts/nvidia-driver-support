name: Build sysext (CI smoke)

# Cross-compiles nvidia.raw for a few supported driver branches on a native
# ubuntu-24.04 runner (same build path users get inside the on-host
# ubuntu:24.04 container, minus docker). This is a SMOKE TEST only — it
# catches upstream breakage (NVIDIA changes the .run installer, kernel header
# path moves, a legacy installer drops a flag) before users hit it. Nothing is
# published: NVIDIA's EULA prohibits redistributing the proprietary userspace,
# so nvidia.raw is only ever assembled on the user's own host.

on:
  pull_request:
    paths:
      - 'scripts/build-nvidia-sysext.sh'
      - '.github/workflows/build-sysext.yml'
  workflow_dispatch:
    inputs:
      nvidia_version:
        description: 'Override: exact NVIDIA driver version (else builds the catalog matrix)'
        required: false
      truenas_version:
        description: 'Override: TrueNAS version (else tracked-versions.json)'
        required: false
      kernel_module_type:
        description: 'open | proprietary'
        required: false
        default: 'open'
  # Callable so release.yml can run the full smoke matrix as a publish gate.
  workflow_call:
    inputs:
      nvidia_version:
        type: string
        required: false
        default: ''
      truenas_version:
        type: string
        required: false
        default: ''
      kernel_module_type:
        type: string
        required: false
        default: 'open'

permissions:
  contents: read

# Cancel an in-progress run when a new commit is pushed to the same ref, so
# rapid PR iteration doesn't stack overlapping ~9-job builds. Each event type
# gets its own group (a workflow_dispatch on a branch won't cancel a PR run).
concurrency:
  group: build-sysext-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      truenas: ${{ steps.set.outputs.truenas }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the version matrix
        id: set
        env:
          # `inputs` is populated for both workflow_dispatch and workflow_call;
          # fall back to github.event.inputs for safety. On pull_request all are
          # empty, so the full catalog matrix is built (unchanged behavior).
          OV_NVIDIA: ${{ inputs.nvidia_version || github.event.inputs.nvidia_version }}
          OV_TRUENAS: ${{ inputs.truenas_version || github.event.inputs.truenas_version }}
          OV_KMOD: ${{ inputs.kernel_module_type || github.event.inputs.kernel_module_type }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          cat = json.load(open("catalog/driver-catalog.json"))
          tracked = json.load(open(".github/tracked-versions.json"))
          truenas = os.environ.get("OV_TRUENAS") or tracked["truenas"]["version"]

          def branch_version(name):
              b = cat["branches"][name]
              if "version" in b:
                  return b["version"]
              return cat["open_latest"][0]

          ov = os.environ.get("OV_NVIDIA")
          if ov:
              entries = [{"label": ov, "nvidia": ov,
                          "kmod": os.environ.get("OV_KMOD") or "open"}]
          else:
              # Smoke the newest open driver "trains" in BOTH module flavors,
              # plus the legacy split. Modern drivers ship open and proprietary
              # modules from distinct sources, so build each of the newest 3
              # open trains (newest release per major in open_latest, e.g.
              # 610/595/590) and the 580 branch as both open (Turing+) and
              # proprietary (Maxwell/Pascal/Volta). 470 (Kepler) is
              # proprietary-only, built from the vendored patch set. Older
              # trains stay user-installable via --driver=X.Y.Z; they just
              # aren't smoke-built here.
              open_trains = {}
              for v in cat["open_latest"]:        # newest-first
                  open_trains.setdefault(v.split(".")[0], v)
              modern = list(open_trains.values())[:3]
              s580 = branch_version("legacy-580")
              if s580 not in modern:
                  modern.append(s580)
              entries = []
              for v in modern:
                  m = v.split(".")[0]
                  entries.append({"label": f"open-{m}", "nvidia": v, "kmod": "open"})
                  entries.append({"label": f"prop-{m}", "nvidia": v, "kmod": "proprietary"})
              entries.append({"label": "legacy-470", "nvidia": branch_version("legacy-470"), "kmod": "proprietary"})
          print("matrix=" + json.dumps({"include": entries}))
          print("truenas=" + truenas)
          PY

      - name: Show matrix
        run: |
          echo 'TrueNAS: ${{ steps.set.outputs.truenas }}'
          echo 'Matrix : ${{ steps.set.outputs.matrix }}'

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: build ${{ matrix.label }} (${{ matrix.nvidia }}, ${{ matrix.kmod }})
    # An entry can opt into continue-on-error with "experimental": True in the
    # matrix (none currently do) — e.g. a target built from a volatile external
    # patch set — to stay visible without failing the run. legacy-470 is now a
    # required build.
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          # legacy-470 builds from the nvidia-470xx-linux-mainline patch
          # submodule under third_party/.
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-14 squashfs-tools kmod xz-utils \
            bison flex libelf-dev bc rsync libssl-dev pkg-config \
            pciutils gnupg ca-certificates wget curl patch

      - name: Build nvidia.raw (smoke)
        env:
          TRUENAS: ${{ needs.prepare.outputs.truenas }}
          NVIDIA: ${{ matrix.nvidia }}
          KMOD: ${{ matrix.kmod }}
        run: |
          sudo --preserve-env=TRUENAS,NVIDIA,KMOD scripts/build-nvidia-sysext.sh \
            --nvidia-version="$NVIDIA" \
            --truenas-version="$TRUENAS" \
            --kernel-module-type="$KMOD" \
            --out=dist

      - name: Verify output
        run: |
          test -f dist/nvidia.raw
          echo "Built: $(du -h dist/nvidia.raw | cut -f1)"
          unsquashfs -l dist/nvidia.raw | grep -E 'libnvidia-ml\.so|nvidia\.ko' | head
          # Uninstaller must be bundled on PATH (build-nvidia-sysext.sh Phase 5b).
          unsquashfs -l dist/nvidia.raw | grep -q 'usr/bin/uninstall-nvidia-driver$' \
            || { echo "::error::uninstall-nvidia-driver not bundled in nvidia.raw"; exit 1; }
          echo "ok: /usr/bin/uninstall-nvidia-driver bundled"
